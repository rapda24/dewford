<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 | Dewford</title><link rel="stylesheet" href="assets/css/dewford-admin.css"><script src="assets/data/dewford-events.js" defer></script><script src="assets/js/dewford-admin-preview.js" defer></script><script src="assets/js/dewford-admin.js" defer></script></head>
<body class="df-admin"><div id="df-auth-loading" role="status">관리자 권한을 확인하고 있습니다.</div><div id="df-dashboard" hidden><aside class="df-sidebar"><a class="df-brand" href="admin.html"><img src="assets/images/dewford/logo-sharp-white.svg" width="316" height="75" alt="DEWFORD INTERNATIONAL COLLEGE"></a><p class="df-nav-label">WORKSPACE</p><nav aria-label="관리자 메뉴"><a href="?board=event" data-nav="event">이벤트 게시판 <span>↗</span></a><a href="?board=preschool" data-nav="preschool">유치부 캘린더 <span>↗</span></a><a href="?board=elementary" data-nav="elementary">초등부 캘린더 <span>↗</span></a><a href="?board=inquiries" data-nav="inquiries">상담 신청 내역 <span>↗</span></a></nav><div class="df-sidebar-bottom"><a href="index.html">홈페이지 보기 ↗</a><button type="button" data-logout>로그아웃</button></div></aside><main class="df-workspace"><header class="df-topbar"><span>DEWFORD / ADMIN</span><span id="df-admin-name"></span></header><div class="df-page"><p class="df-eyebrow">MANAGE YOUR DEWFORD</p><div class="df-page-heading"><div><h1 id="df-page-title">이벤트 게시판</h1><p class="df-muted" id="df-page-description"></p></div><button class="df-primary" id="df-create" type="button">+ 글쓰기</button></div><section class="df-stats" aria-label="관리 현황"><a href="?board=event"><span>이벤트</span><strong id="df-event-count">0</strong></a><a href="?board=preschool"><span>전체 학사 일정</span><strong id="df-calendar-count">0</strong></a><a href="?board=inquiries"><span>새 상담 신청</span><strong id="df-inquiry-count">0</strong></a></section><section class="df-content"><div class="df-filter"><label class="df-search">검색<input id="df-search" type="search" placeholder="제목 또는 이름 검색"></label><label id="df-status-filter-wrap" hidden>처리 상태<select id="df-status-filter"><option value="">전체 상태</option><option value="new">신규</option><option value="reviewing">상담 중</option><option value="done">완료</option></select></label><span id="df-result-count"></span><a id="df-public-link" href="event.html">게시판 보기 ↗</a></div><p id="df-status" role="status" aria-live="polite"></p><div id="df-list"></div></section></div></main></div><dialog id="df-editor" class="df-dialog" aria-labelledby="df-editor-title"><form id="df-editor-form"><div class="df-dialog-heading"><h2 id="df-editor-title">글쓰기</h2><button type="button" data-close aria-label="닫기">×</button></div><input name="id" type="hidden"><div class="df-form-grid"><label>게시판<select name="board"><option value="event">이벤트</option><option value="preschool">유치부 캘린더</option><option value="elementary">초등부 캘린더</option></select></label><label>날짜<input name="date" type="date"></label></div><label>제목<input name="title" required maxlength="200" placeholder="게시글 제목을 입력해 주세요"></label><label>내용<textarea name="description" rows="7" maxlength="20000" placeholder="일정 안내 또는 이벤트 내용을 입력해 주세요"></textarea></label><div id="df-event-fields"><div class="df-form-grid"><label>카테고리<input name="category" maxlength="100" placeholder="SCHOOL LIFE"></label><label>대표 이미지 설명<input name="alt" maxlength="300" placeholder="사진을 설명하는 문장"></label></div><label>대표 이미지 경로 / 주소<input name="image" maxlength="2000" placeholder="assets/images/… 또는 https://…"></label><label>목록 요약<textarea name="excerpt" rows="2" maxlength="1000"></textarea></label><details><summary>상세 페이지의 추가 제목·사진 편집</summary><label>소제목 (한 줄에 하나)<textarea name="headings" rows="4"></textarea></label><label>추가 이미지 주소 (한 줄에 하나)<textarea name="gallery" rows="3"></textarea></label></details></div><p id="df-editor-status" role="status"></p><div class="df-dialog-actions"><button type="button" data-close>취소</button><button type="submit" class="df-primary">저장하기</button></div></form></dialog><dialog id="df-inquiry-detail" class="df-dialog" aria-labelledby="df-inquiry-title"><div class="df-dialog-heading"><h2 id="df-inquiry-title">상담 신청 내용</h2><button type="button" data-close aria-label="닫기">×</button></div><div id="df-inquiry-body"></div><div class="df-dialog-actions"><button type="button" data-close>닫기</button></div></dialog></body></html>
