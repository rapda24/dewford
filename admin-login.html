<body class="df-admin df-login"><main class="df-login-layout"><section class="df-login-story"><a class="df-brand" href="index.html"><img src="assets/images/dewford/logo-sharp-white.svg" width="316" height="75" alt="DEWFORD INTERNATIONAL COLLEGE"></a><div><p class="df-eyebrow">DEWFORD ADMIN</p><h1>배움의 순간을<br>함께 기록하는 곳.</h1><p>학사 일정과 이벤트, 학부모 상담을<br>한 곳에서 관리하세요.</p></div><small>Every little discovery matters.</small></section><section class="df-login-panel"><div class="df-login-box"><p class="df-eyebrow">WELCOME BACK</p><h2>관리자 로그인</h2><p class="df-muted">관리자 계정으로 로그인해 주세요.</p><form id="df-login-form"><label>아이디<input name="username" autocomplete="username" required maxlength="100" placeholder="관리자 아이디"></label><label>비밀번호<div class="df-password"><input name="password" type="password" autocomplete="current-password" required maxlength="1024" placeholder="비밀번호"><button type="button" id="df-password-toggle" aria-pressed="false">표시</button></div></label><p id="df-login-status" role="status" aria-live="polite"></p><button type="submit" class="df-primary df-wide">로그인 <span>→</span></button></form><a class="df-back" href="index.html">← 홈페이지로 돌아가기</a></div></section></main></body></html>
